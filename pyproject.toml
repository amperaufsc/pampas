[project]
name = "ws"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cantools>=42.0.1",
    "colcon-common-extensions>=0.3.0",
    "depthai>=3.7.1",
    "empy==3.3.4",
    "huggingface-hub>=1.21.0",
    "lark>=1.3.1",
    "numpy<2",
    "scipy>=1.15.3",    
    "torch>=2.1.0",
    "ultralytics>=8.4.81",
    "wheel>=0.47.0",
